<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Word Chant Reading Cards</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
       background:linear-gradient(135deg,#fff8fb,#f6fbff);color:#333}
  .wrap{max-width:1100px;margin:auto;padding:20px}
  header{background:#fff;border:3px solid #f08aaa;border-radius:20px;padding:18px 22px;
         box-shadow:0 5px 18px #0001;margin-bottom:18px}
  h1{margin:0 0 6px;font-size:clamp(24px,4vw,38px);color:#e85b83}
  .sub{margin:0;font-size:16px}
  .how{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
  .pill{background:#f9e7ef;border-radius:999px;padding:7px 12px;font-size:14px}
  .controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:16px 0}
  button{border:0;border-radius:12px;padding:10px 15px;font-weight:700;cursor:pointer;
         box-shadow:0 2px 7px #0002;background:#fff}
  button:hover{transform:translateY(-1px)}
  .primary{background:#e85b83;color:#fff}
  .blue{background:#5c8fe8;color:#fff}
  .green{background:#63a879;color:#fff}
  #score{font-weight:700;margin-left:auto}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px}
  .card{height:285px;perspective:1000px;cursor:pointer}
  .inner{position:relative;width:100%;height:100%;transition:transform .55s;transform-style:preserve-3d}
  .card.flipped .inner{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;
        background:#fff;border:2px solid #ddd;box-shadow:0 5px 15px #0001;
        display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px}
  .front{border-color:#b9d7ee;justify-content:center}
  .front .hint{font-size:14px;color:#678;margin-top:6px;text-align:center}
  .front-word{font-size:38px;line-height:1.05;font-weight:800;color:#333;letter-spacing:.5px;margin-top:2px}
  .art{width:150px;height:145px;object-fit:contain;margin-bottom:2px}
  .back{transform:rotateY(180deg);border-color:#f1a1b9;text-align:center}
  .word{font-size:40px;font-weight:800;color:#e85b83;letter-spacing:.5px}
  .reading{font-size:21px;font-weight:700;color:#555;margin-top:5px}
  .meaning{font-size:18px;margin:9px 0 13px}
  .speak{background:#5c8fe8;color:#fff;padding:8px 12px}
  .note{font-size:13px;color:#777;margin-top:9px}
  .done{display:none;text-align:center;padding:30px;background:#fff;border-radius:18px;margin-top:18px}
  @media(max-width:600px){.card{height:250px}.art{width:125px;height:130px}.word{font-size:34px}#score{margin-left:0}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>📖 Word Reading Cards</h1>
  <p class="sub">イラストを見て、英単語を声に出して読もう！ → カードをクリックすると答えが出ます。</p>
  <div class="how">
    <span class="pill">① イラストを見る</span>
    <span class="pill">② 英語を読む</span>
    <span class="pill">③ めくって確認</span>
    <span class="pill">④ 意味を言う</span>
  </div>
</header>

<div class="controls">
  <button class="primary" onclick="shuffleCards()">🔀 シャッフル</button>
  <button class="blue" onclick="flipAll()">👀 全部めくる</button>
  <button class="green" onclick="resetAll()">↩ もどす</button>
  <button onclick="newRound()">🎯 新しいラウンド</button>
  <span id="score">読めたカード：0 / 20</span>
</div>

<div id="grid" class="grid"></div>
<div id="done" class="done">
  <h2>🎉 Great reading!</h2>
  <p>もう一度シャッフルして、今度はもっと速く読んでみよう。</p>
</div>
</div>

let deck = [...cards];
let readCount = 0;

function render(){
  const grid=document.getElementById("grid");
  grid.innerHTML="";
  deck.forEach((c,i)=>{
    const el=document.createElement("div");
    el.className="card";
    el.dataset.index=i;
    el.innerHTML=`
      <div class="inner">
        <div class="face front">
          <img class="art" src="${c.img}" alt="illustration">
          <div class="front-word">${c.word}</div>
          <div class="hint">まず自分で読もう！ → クリックで答え合わせ</div>
        </div>
        <div class="face back">
          <div class="word">${c.word}</div>
          <div class="reading">${c.reading}</div>
          <div class="meaning">${c.meaning}</div>
          <button class="speak" onclick="speak(event, ${i})">🔊 聞く</button>
          <div class="note">読み方・意味を確認しよう</div>
        </div>
      </div>`;
    el.addEventListener("click",()=>flipOne(el));
    grid.appendChild(el);
  });
  updateScore();
}
function flipOne(el){
  const was=el.classList.contains("flipped");
  el.classList.toggle("flipped");
  if(!was){ readCount++; updateScore(); }
}
function speak(e,i){
  e.stopPropagation();
  const u=new SpeechSynthesisUtterance(deck[i].word);
  u.lang="en-US"; u.rate=.8;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}
function flipAll(){
  document.querySelectorAll(".card").forEach(c=>c.classList.add("flipped"));
}
function resetAll(){
  document.querySelectorAll(".card").forEach(c=>c.classList.remove("flipped"));
  readCount=0; updateScore();
}
function shuffleCards(){
  for(let i=deck.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [deck[i],deck[j]]=[deck[j],deck[i]];
  }
  readCount=0; render();
}
function newRound(){ shuffleCards(); window.scrollTo({top:0,behavior:"smooth"}); }
function updateScore(){
  document.getElementById("score").textContent=`読めたカード：${readCount} / ${deck.length}`;
  document.getElementById("done").style.display=readCount===deck.length?"block":"none";
}
render();
</script>
